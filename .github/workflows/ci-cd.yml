name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check that the app imports
        run: python -c "import app.main; print('Build OK')"

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (flake8)
        run: flake8 app tests --max-line-length=100
      - name: Run unit tests
        run: pytest -v

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Deploy (blue-green, auto rollback)
        run: bash scripts/deploy.sh
      - name: Show deployed app
        run: curl -s http://localhost:5000/health && curl -s "http://localhost:5000/api/add?a=2&b=3"
      - name: Generate status dashboard
        if: always()
        run: python scripts/generate_status.py
      - name: Upload logs and dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-and-status
          path: |
            logs/
            status.html
